name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  # Jalankan manual dari tab Actions dan pilih env-nya.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Env target (prod = read-only, test write di-skip)'
        type: choice
        options: [dev, staging, prod]
        default: dev

# Batalkan run lama untuk branch/PR yang sama bila ada push baru.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.project }})
    needs: typecheck
    # Playwright 1.28 hanya mendukung dependensi browser sampai Ubuntu 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # chromium = Part A (UI Sauce Demo), api = Part B (Restful-Booker)
        include:
          - project: chromium
            args: ''
          # API dijalankan paralel (4 worker) dan diulang 2x di setiap PR
          # untuk membuktikan test tidak saling bergantung / berbagi data.
          - project: api
            args: --workers=4 --repeat-each=2
    env:
      # Push & PR selalu dev; run manual memakai env yang dipilih.
      TEST_ENV: ${{ inputs.environment || 'dev' }}
      # Kosong bila secret tidak ada; di dev dipakai kredensial demo.
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
      UI_USERNAME: ${{ secrets.UI_USERNAME }}
      UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
      UI_LOCKED_USERNAME: ${{ secrets.UI_LOCKED_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci

      - name: Install Chromium
        if: matrix.project == 'chromium'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} ${{ matrix.args }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (trace, screenshot, video)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14
